# Publie le jeu sur GitHub Pages à chaque modification de la branche main.
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers du jeu
        run: |
          bash scripts/verifier-sw.sh
          mkdir _site
          cp -r index.html style.css src lib modeles _site/
          cp -r manifest.webmanifest sw.js confidentialite.html credits.html CREDITS.md icons captures _site/
          # Référencement : robots.txt et sitemap.xml
          cp robots.txt sitemap.xml _site/
          # Version du cache hors ligne = commit publié : les joueurs reçoivent la mise à jour
          sed -i "s/__VERSION__/${GITHUB_SHA}/" _site/sw.js
          grep -q "${GITHUB_SHA}" _site/sw.js

      - name: Fabriquer le zip pour itch.io
        run: bash scripts/zip-itch.sh

      - name: Garder le zip itch.io (onglet « Artifacts » de cette exécution)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-frontier-itch
          path: dist/nexus-frontier-itch.zip

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
